{% extends "base.html" %}
{% block content %}
<div
  class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-6 select-none"
  id="app"
>
  <div class="lg:col-span-5 space-y-4">
    <div
      class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"
    >
      <div
        class="bg-gray-100 px-4 py-2 border-b border-gray-200 flex justify-between items-center"
      >
        <span class="font-bold text-gray-700">擬似言語コード</span>
        <span class="text-xs text-[#15803d] font-bold" id="status-text"
          >実行中...</span
        >
      </div>
      <div
        class="p-4 font-mono text-sm leading-8 bg-white"
        id="code-container"
      ></div>
    </div>

    <div class="bg-white p-4 rounded-lg shadow-sm border border-gray-200">
      <div class="flex justify-between items-center mb-2">
        <span class="font-bold text-gray-700">操作パネル</span>
        <button
          onclick="resetTrace()"
          class="text-xs text-gray-500 underline hover:text-gray-800"
        >
          最初から
        </button>
      </div>

      <div id="quiz-area" class="space-y-3">
        <div
          class="p-3 bg-blue-50 border border-blue-100 rounded text-sm text-blue-900"
        >
          <p class="font-bold mb-1">Q. 次のステップの結果は？</p>
          <p id="question-text" class="mb-2">...</p>

          <div id="options-area" class="grid grid-cols-2 gap-2"></div>
        </div>
        <div
          id="feedback-area"
          class="hidden p-3 rounded text-sm font-bold"
        ></div>
      </div>

      <div id="completion-area" class="hidden text-center py-4">
        <p class="text-green-600 font-bold text-lg mb-2">トレース完了！</p>
        <a
          href="{{ url_for('problem_list', mode='practice') }}"
          class="inline-block bg-gray-600 text-white px-4 py-2 rounded hover:bg-gray-700 text-sm"
          >問題一覧へ戻る</a
        >
      </div>
    </div>
  </div>

  <div class="lg:col-span-7">
    <div
      class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden"
    >
      <div
        class="bg-gray-50 px-4 py-2 border-b border-gray-300 flex items-center justify-between"
      >
        <h3 class="font-bold text-[#15803d]">トレースエリア</h3>
        <!-- モード切り替えタブ -->
        <div class="flex text-xs font-bold rounded-full border border-gray-300 overflow-hidden">
          <button
            type="button"
            id="tab-trace"
            class="px-3 py-1 bg-white text-gray-700 hover:bg-gray-100 transition"
            onclick="showTraceTable()"
          >
            トレース表
          </button>
          <button
            type="button"
            id="tab-canvas"
            class="px-3 py-1 bg-gray-100 text-gray-500 hover:bg-gray-200 transition"
            onclick="showCanvas()"
          >
            手書きスペース
          </button>
        </div>
      </div>

      <!-- トレース表モード -->
      <div id="trace-table-wrapper">
        <div class="overflow-x-auto">
          <table class="w-full text-sm text-center border-collapse">
            <thead>
              <tr class="bg-gray-100 text-gray-700">
                <th class="p-2 border border-gray-400 w-10">#</th>
                <th class="p-2 border border-gray-400 w-12">行</th>
                <th class="p-2 border border-gray-400">条件式</th>
                <th class="p-2 border border-gray-400">出力</th>
              </tr>
            </thead>
            <tbody id="trace-table-body" class="bg-white"></tbody>
          </table>
        </div>
      </div>

<!-- 手書きキャンバスモード -->
<div
  id="canvas-area"
  class="hidden p-4 bg-white flex flex-col items-stretch"
>
  <p class="text-xs text-gray-500 mb-2">
    スタック / キュー / リスト構造の時の問題など、自由に使ってください。
  </p>

  <div class="border border-gray-300 rounded bg-gray-50 overflow-hidden">
    <canvas
      id="freeCanvas"
      width="900"
      height="400"
      class="bg-white block"
    ></canvas>
  </div>

  <div class="flex justify-between items-center mt-2 text-xs">

    <!-- 左側：色選択 & 消しゴム -->
    <div class="flex items-center space-x-3">
      <span class="text-gray-500">ペン色:</span>

      <!-- 色ボタン -->
      <button data-color="#000000"
        class="color-btn w-5 h-5 rounded-full border border-gray-300 bg-black"
        onclick="setPenColor('#000000', this)">
      </button>

      <button data-color="#3b82f6"
        class="color-btn w-5 h-5 rounded-full border border-gray-300 bg-blue-500"
        onclick="setPenColor('#3b82f6', this)">
      </button>

      <button data-color="#ef4444"
        class="color-btn w-5 h-5 rounded-full border border-gray-300 bg-red-500"
        onclick="setPenColor('#ef4444', this)">
      </button>

      <button data-color="#10b981"
        class="color-btn w-5 h-5 rounded-full border border-gray-300 bg-emerald-500"
        onclick="setPenColor('#10b981', this)">
      </button>

      <!-- 消しゴムボタン -->
      <button
        id="eraser-btn"
        class="px-2 py-1 border border-gray-300 rounded text-gray-600 hover:bg-gray-100"
        onclick="enableEraser(this)"
      >
        消しゴム
      </button>
    </div>

    <!-- 右側：太さ & クリア -->
    <div class="flex items-center space-x-3">
      <label class="flex items-center space-x-1 text-gray-500">
        <span>太さ</span>
        <input
          type="range"
          min="2"
          max="10"
          value="3"
          id="pen-width"
          class="w-20"
          onchange="setPenWidth(this.value)"
        />
      </label>

      <button
        type="button"
        class="text-gray-500 underline hover:text-gray-800"
        onclick="clearCanvas()"
      >
        クリア
      </button>
    </div>

  </div>
</div>
      </div>
    </div>
  </div>
</div>

<script>
  const PROBLEM_DATA = {{ problem.to_dict() | tojson }};
</script>

<script>
  // 状態管理変数
  let currentStepIndex = 0;
  let traceHistory = [];
  let currentVars = {};
  let isFinished = false;

  // DOM要素
  const codeContainer = document.getElementById('code-container');
  const tableBody = document.getElementById('trace-table-body');
  const questionText = document.getElementById('question-text');
  const optionsArea = document.getElementById('options-area');
  const feedbackArea = document.getElementById('feedback-area');
  const quizArea = document.getElementById('quiz-area');
  const completionArea = document.getElementById('completion-area');

  // 手書きキャンバス関連
let canvas, ctx;
let drawing = false;
let penColor = '#000000';
let penWidth = 3;
let isEraser = false;

  // 色選択
function setPenColor(color, btn) {
  isEraser = false;
  penColor = color;

  if (ctx) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.strokeStyle = penColor;
    ctx.lineWidth = penWidth;
  }

  // 色ボタンの枠線リセット
  document.querySelectorAll('.color-btn').forEach(b => {
    b.classList.remove('ring-2', 'ring-gray-700');
  });

  // 選択中の色に枠線
  btn.classList.add('ring-2', 'ring-gray-700');

  // 消しゴムボタンの強調解除
  document.getElementById('eraser-btn').classList.remove('bg-gray-200');
  document.getElementById('eraser-btn').classList.remove(
  'bg-yellow-200',
  'border-yellow-500',
  'text-yellow-800'
);
}
 

 

// 太さ変更
function setPenWidth(width) {
  penWidth = Number(width);
  if (ctx) ctx.lineWidth = penWidth;
}

// 消しゴムモード
function enableEraser(btn) {
  isEraser = true;

  if (ctx) {
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineWidth = 20;
  }

  // 色ボタンの枠線を外す
  document.querySelectorAll('.color-btn').forEach(b => {
    b.classList.remove('ring-2', 'ring-gray-700');
  });


  btn.classList.add(
    'bg-yellow-200',
    'border-yellow-500',
    'text-yellow-800'
  );
}

  // 初期化
  function init() {
    // 変数初期化
    currentVars = {};
    PROBLEM_DATA.variables.forEach((v) => (currentVars[v] = '-'));

    // コード表示生成
    codeContainer.innerHTML = PROBLEM_DATA.code
      .map(
        (line, idx) => `
            <div class="code-line px-2 py-0.5 flex items-center hover:bg-gray-50 transition" id="line-${
              idx + 1
            }">
                <span class="w-6 text-gray-400 text-right mr-3 text-xs select-none">${
                  idx + 1
                }:</span>
                <span class="font-mono text-gray-700">${line}</span>
            </div>
        `
      )
      .join('');

    // トレース表ヘッダー生成（変数列）
    const headerRow = document.querySelector('#trace-table-wrapper thead tr');

    // 条件式と出力の間にある変数列を一度クリア
    const conditionTh = headerRow.children[2];
    const outputTh = headerRow.lastElementChild;
    while (
      conditionTh.nextElementSibling &&
      conditionTh.nextElementSibling !== outputTh
    ) {
      headerRow.removeChild(conditionTh.nextElementSibling);
    }
    // 変数列再生成
    PROBLEM_DATA.variables.forEach((v) => {
      const th = document.createElement('th');
      th.className = 'p-2 border border-gray-400 w-16 font-mono text-[#15803d]';
      th.textContent = v;
      headerRow.insertBefore(th, outputTh);
    });

    // テーブル本体クリア
    tableBody.innerHTML = '';

    // 手書きキャンバス初期化
    setupCanvas();

    // モード初期表示はトレース表
    showTraceTable();

    renderStep();
  }

  // ステップ描画・クイズ出題
  function renderStep() {
    if (currentStepIndex >= PROBLEM_DATA.steps.length) {
      finishGame();
      return;
    }

    const step = PROBLEM_DATA.steps[currentStepIndex];

    // 1. コードハイライト
    document.querySelectorAll('.code-line').forEach((el) => {
      el.classList.remove(
        'bg-yellow-100',
        'border-l-4',
        'border-yellow-500',
        '-ml-1'
      );
      el.classList.add('px-2'); // reset padding
    });
    const activeLine = document.getElementById(`line-${step.line}`);
    if (activeLine) {
      activeLine.classList.add(
        'bg-yellow-100',
        'border-l-4',
        'border-yellow-500',
        '-ml-1'
      );
      activeLine.classList.remove('px-2');
      activeLine.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    // 2. クイズ生成
    feedbackArea.classList.add('hidden');
    optionsArea.innerHTML = '';

    if (step.type === 'condition') {
      questionText.textContent = `条件式「${step.expr}」の評価結果は？`;
      createOptionBtn('True (真)', step.result === true);
      createOptionBtn('False (偽)', step.result === false);
    } else if (step.type === 'assign') {
      questionText.textContent = `変数 ${step.var} に代入される値は？`;
      const correct = step.val;
      let opts = new Set([correct, correct + 1, correct - 1, 0, 1]);
      Array.from(opts)
        .sort((a, b) => a - b)
        .forEach((val) => {
          createOptionBtn(val, val === correct);
        });
    } else if (step.type === 'output') {
      questionText.textContent = `出力される値は？`;
      const correct = step.val;
      let opts = new Set([correct, correct + 1, correct - 1]);
      Array.from(opts).forEach((val) => createOptionBtn(val, val === correct));
    }

    // プレースホルダー行の表示（テーブル）
    const existingPending = document.getElementById('pending-row');
    if (existingPending) existingPending.remove();

    const tr = document.createElement('tr');
    tr.id = 'pending-row';
    tr.className = 'bg-yellow-50 animate-pulse border-2 border-yellow-200';
    tr.innerHTML = `
            <td class="p-2 text-gray-400 text-xs">${getStepLabel(
              currentStepIndex
            )}</td>
            <td class="p-2 font-mono text-gray-500">${step.line}</td>
            <td class="p-2 text-gray-400 text-xs" colspan="${
              PROBLEM_DATA.variables.length + 2
            }">入力待ち...</td>
        `;
    tableBody.appendChild(tr);
    tableBody.parentElement.scrollTop = tableBody.parentElement.scrollHeight;
  }

  function createOptionBtn(label, isCorrect) {
    const btn = document.createElement('button');
    btn.textContent = label;
    btn.className =
      'py-2 px-3 bg-white border border-gray-300 rounded shadow-sm hover:bg-indigo-50 font-mono font-bold text-gray-700 transition';
    btn.onclick = () => handleAnswer(isCorrect);
    optionsArea.appendChild(btn);
  }

  function handleAnswer(isCorrect) {
    feedbackArea.classList.remove('hidden');
    if (isCorrect) {
      feedbackArea.textContent = '正解！';
      feedbackArea.className =
        'p-3 rounded text-sm font-bold bg-green-100 text-green-700 mb-2';

      setTimeout(() => {
        commitStep();
      }, 600);
    } else {
      feedbackArea.textContent = '違います。変数の現在の値を確認してください。';
      feedbackArea.className =
        'p-3 rounded text-sm font-bold bg-red-100 text-red-700 mb-2';
    }
  }

  // 正解時の処理：トレース表に行を確定させる
  function commitStep() {
    const step = PROBLEM_DATA.steps[currentStepIndex];
    const pendingRow = document.getElementById('pending-row');
    if (pendingRow) pendingRow.remove();

    // 内部状態更新
    if (step.type === 'assign') {
      currentVars[step.var] = step.val;
    }

    const tr = document.createElement('tr');
    tr.className = 'hover:bg-gray-50 transition border-b border-gray-100';

    // 変数セル
    let varCells = '';
    let prevVars =
      traceHistory.length > 0 ? traceHistory[traceHistory.length - 1].vars : {};

    PROBLEM_DATA.variables.forEach((v) => {
      const val = currentVars[v];
      const isChanged = step.type === 'assign' && step.var === v;

      varCells += `<td class="p-2 border border-gray-300 font-mono relative ${
        isChanged ? 'text-[#15803d] font-bold bg-green-50' : 'text-gray-300'
      }">
                ${isChanged ? val : '"'}
            </td>`;
    });

    const condCell =
      step.type === 'condition'
        ? `<div class="flex justify-between px-1"><span class="text-xs">${
            step.expr
          }</span><span class="${
            step.result ? 'text-blue-600' : 'text-red-500'
          } font-bold">${step.result ? 'T' : 'F'}</span></div>`
        : '';

    const outputCell =
      step.type === 'output'
        ? `<span class="font-bold">${step.val}</span>`
        : '';

    tr.innerHTML = `
            <td class="p-2 border border-gray-300 bg-gray-100 text-gray-500 text-xs font-bold">${getStepLabel(
              currentStepIndex
            )}</td>
            <td class="p-2 border border-gray-300 font-mono text-gray-600">${
              step.line
            }</td>
            <td class="p-2 border border-gray-300 font-mono text-xs text-left">${condCell}</td>
            ${varCells}
            <td class="p-2 border border-gray-300 font-mono">${outputCell}</td>
        `;

    tableBody.appendChild(tr);

    traceHistory.push({
      vars: { ...currentVars },
    });

    currentStepIndex++;
    renderStep();
  }

  function finishGame() {
    isFinished = true;
    quizArea.classList.add('hidden');
    completionArea.classList.remove('hidden');
    document.getElementById('status-text').textContent = '完了';
    document.getElementById('status-text').className =
      'text-xs text-green-600 font-bold';

    document.querySelectorAll('.code-line').forEach((el) => {
      el.classList.remove(
        'bg-yellow-100',
        'border-l-4',
        'border-yellow-500',
        '-ml-1'
      );
      el.classList.add('px-2');
    });

    fetch('/api/log_result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        problem_id: PROBLEM_DATA.id,
        is_correct: true,
      }),
    });
  }

  function resetTrace() {
    currentStepIndex = 0;
    traceHistory = [];
    isFinished = false;
    tableBody.innerHTML = '';
    quizArea.classList.remove('hidden');
    completionArea.classList.add('hidden');
    init();
  }

  function getStepLabel(idx) {
    const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    return (
      letters[idx % 26] + (Math.floor(idx / 26) > 0 ? Math.floor(idx / 26) : '')
    );
  }

  // -------------------------
  // トレース表 / 手書きスペース 切り替え
  // -------------------------
  function showTraceTable() {
    document.getElementById('trace-table-wrapper').classList.remove('hidden');
    document.getElementById('canvas-area').classList.add('hidden');

    const tabTrace = document.getElementById('tab-trace');
    const tabCanvas = document.getElementById('tab-canvas');
    tabTrace.classList.add('bg-white', 'text-gray-700');
    tabTrace.classList.remove('bg-gray-100', 'text-gray-500');
    tabCanvas.classList.add('bg-gray-100', 'text-gray-500');
    tabCanvas.classList.remove('bg-white', 'text-gray-700');
  }

  function showCanvas() {
    document.getElementById('trace-table-wrapper').classList.add('hidden');
    document.getElementById('canvas-area').classList.remove('hidden');

    const tabTrace = document.getElementById('tab-trace');
    const tabCanvas = document.getElementById('tab-canvas');
    tabCanvas.classList.add('bg-white', 'text-gray-700');
    tabCanvas.classList.remove('bg-gray-100', 'text-gray-500');
    tabTrace.classList.add('bg-gray-100', 'text-gray-500');
    tabTrace.classList.remove('bg-white', 'text-gray-700');
  }

  // -------------------------
// トレース表 / 手書きスペース 切り替え
// -------------------------
function showTraceTable() {
  document.getElementById('trace-table-wrapper').classList.remove('hidden');
  document.getElementById('canvas-area').classList.add('hidden');

  const tabTrace = document.getElementById('tab-trace');
  const tabCanvas = document.getElementById('tab-canvas');
  tabTrace.classList.add('bg-white', 'text-gray-700');
  tabTrace.classList.remove('bg-gray-100', 'text-gray-500');
  tabCanvas.classList.add('bg-gray-100', 'text-gray-500');
  tabCanvas.classList.remove('bg-white', 'text-gray-700');
}

function showCanvas() {
  document.getElementById('trace-table-wrapper').classList.add('hidden');
  document.getElementById('canvas-area').classList.remove('hidden');

  const tabTrace = document.getElementById('tab-trace');
  const tabCanvas = document.getElementById('tab-canvas');
  tabCanvas.classList.add('bg-white', 'text-gray-700');
  tabCanvas.classList.remove('bg-gray-100', 'text-gray-500');
  tabTrace.classList.add('bg-gray-100', 'text-gray-500');
  tabTrace.classList.remove('bg-white', 'text-gray-700');
}

// -------------------------
// 手書きキャンバス関連
// -------------------------
function setupCanvas() {
  canvas = document.getElementById('freeCanvas');
  if (!canvas) return;

  ctx = canvas.getContext('2d');
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = penColor;
  ctx.lineWidth = penWidth;

  // PC用
  canvas.onmousedown = (e) => {
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  };
  canvas.onmouseup = () => {
    drawing = false;
  };
  canvas.onmouseleave = () => {
    drawing = false;
  };
  canvas.onmousemove = (e) => {
    if (!drawing) return;

    if (isEraser) {
      ctx.globalCompositeOperation = 'destination-out';
    } else {
      ctx.globalCompositeOperation = 'source-over';
    }

    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  };

  // タッチデバイス用
  canvas.addEventListener(
    'touchstart',
    (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];
      drawing = true;
      ctx.beginPath();
      ctx.moveTo(t.clientX - rect.left, t.clientY - rect.top);
    },
    { passive: false }
  );

  canvas.addEventListener(
    'touchend',
    (e) => {
      e.preventDefault();
      drawing = false;
    },
    { passive: false }
  );

  canvas.addEventListener(
    'touchmove',
    (e) => {
      e.preventDefault();
      if (!drawing) return;
      const rect = canvas.getBoundingClientRect();
      const t = e.touches[0];

      if (isEraser) {
        ctx.globalCompositeOperation = 'destination-out';
      } else {
        ctx.globalCompositeOperation = 'source-over';
      }

      ctx.lineTo(t.clientX - rect.left, t.clientY - rect.top);
      ctx.stroke();
    },
    { passive: false }
  );
}

function clearCanvas() {
  if (!ctx || !canvas) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// 開始
window.onload = init;
</script>
{% endblock %}
